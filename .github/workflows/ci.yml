name: CI

on:
  workflow_dispatch:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-extras --dev
      - run: uv run --locked pre-commit run --all-files
      - run: uv run --locked pre-commit run --all-files --hook-stage pre-push

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    env:
      # Dummies only, in plain sight — never repository secrets. In ENVIRONMENT=test
      # the client factory returns Fakes, so the suite cannot reach a live payment provider or sndr.
      ENVIRONMENT: test
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: "test-jwt-secret-value-not-real-000000000000"
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TTL_MINUTES: "30"
      JWT_REFRESH_TTL_DAYS: "30"
      JWT_ISSUER: giftly-test
      JWT_AUDIENCE: giftly-test
      FIELD_ENCRYPTION_KEYS: '{"1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      FIELD_ENCRYPTION_KEY_VERSION: "1"
      ADMIN_SESSION_SECRET: "test-admin-session-secret-not-real-00000"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
      # NO SNDR_*. NO AWS_*. Deliberately absent.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --all-extras --dev
      - run: uv run --locked python -m app.bootstrap_db
      - run: uv run pytest -q --cov=app --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --dev
      - name: Audit the locked production dependencies
        run: |
          uv export --locked --no-dev --no-hashes --format requirements-txt \
            --output-file "$RUNNER_TEMP/production-requirements.txt"
          uvx pip-audit==2.10.1 --strict --no-deps --disable-pip \
            --requirement "$RUNNER_TEMP/production-requirements.txt"

  docs:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: "test-jwt-secret-value-not-real-000000000000"
      JWT_ALGORITHM: HS256
      FIELD_ENCRYPTION_KEYS: '{"1":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="}'
      FIELD_ENCRYPTION_KEY_VERSION: "1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --dev
      - run: uv run python -m app.export_openapi
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: docs/openapi.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose services
        run: docker compose config --quiet
      - name: Build the deployment image
        run: docker build -t giftly:ci .
      - name: Assert the image runs as non-root
        run: |
          uid=$(docker run --rm giftly:ci id -u)
          test "$uid" != "0"
      - name: Verify the packaged recording decoder
        run: |
          docker run --rm -i --entrypoint python giftly:ci - <<'PY'
          import asyncio
          import io
          import wave
          from app.core.exceptions import BadRequestError
          from app.services.chat_media_validation import verify_recording

          def recording(seconds):
              output = io.BytesIO()
              with wave.open(output, "wb") as audio:
                  audio.setnchannels(1)
                  audio.setsampwidth(2)
                  audio.setframerate(8000)
                  audio.writeframes(b"\x00\x00" * 8000 * seconds)
              return output.getvalue()

          async def check():
              duration = await verify_recording(recording(1), kind="VOICE", mime="audio/wav", maximum=120)
              assert 0.9 <= duration <= 1.1
              try:
                  await verify_recording(recording(2), kind="VOICE", mime="audio/wav", maximum=1)
              except BadRequestError:
                  pass
              else:
                  raise AssertionError("Overlong recording was accepted")

          asyncio.run(check())
          PY
      - name: Assert no secrets leak into image history
        run: |
          # Scan only the layers OUR Dockerfile adds. The base python image
          # legitimately embeds GPG/key strings to verify the CPython source tarball,
          # so we diff its history out and check what remains. Pull the base first so
          # `docker history python:3.13-slim` works even under buildkit (which does not
          # populate the classic image store for the FROM image).
          base_image=$(sed -n 's/^FROM \(.*\) AS builder$/\1/p' Dockerfile)
          docker pull "$base_image" >/dev/null
          comm -23 \
            <(docker history --no-trunc --format '{{.CreatedBy}}' giftly:ci | sort -u) \
            <(docker history --no-trunc --format '{{.CreatedBy}}' "$base_image" | sort -u) \
            > our_layers.txt
          echo "Our image's unique layers:"; cat our_layers.txt
          if grep -Ei "SECRET|KEY|PASSWORD" our_layers.txt; then
            echo "Found a secret-like string in our image layers"; exit 1
          fi
