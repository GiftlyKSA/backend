{% extends "base.html" %}
{% block content %}
<h1>Couriers pending verification</h1>
<p><a class="btn" href="/v1/admin/admin/couriers/new">Add courier profile</a></p>
<table class="list">
  <thead><tr><th>User</th><th>City</th><th>Created</th></tr></thead>
  <tbody>{% for p in pending %}
    <tr><td><a href="/v1/admin/admin/couriers/{{ p.user_id }}">{{ p.user_id }}</a> · <a href="/v1/admin/admin/tables/courier_profiles/{{ p.user_id }}/edit">Edit / delete</a></td>
        <td>{{ p.city_of_residence }}</td><td>{{ p.created_at }}</td></tr>
  {% else %}<tr><td colspan="3">None pending.</td></tr>{% endfor %}</tbody>
</table>
{% endblock %}
