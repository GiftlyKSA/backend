{% extends "base.html" %}
{% block content %}
<h1>{{ tr('Wallet') }}</h1>
{% if not wallet %}<p>{{ tr('Not found.') }}</p>{% else %}
<section class="card"><table>
  <tr><td>{{ tr('ID') }}</td><td>{{ wallet.id }}</td></tr>
  <tr><td>{{ tr('Type') }}</td><td>{{ tr(wallet.type) }}</td></tr>
  <tr><td>{{ tr('Balance') }}</td><td class="num">{{ wallet.balance }}</td></tr>
  <tr><td>{{ tr('Held') }}</td><td class="num">{{ wallet.held_balance }}</td></tr>
</table></section>
{% endif %}
{% endblock %}
