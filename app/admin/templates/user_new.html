{% extends "base.html" %}
{% block content %}
<h1>{{ tr('Add user') }}</h1>
<section class="card edit-card">
  <form method="post" action="/v1/admin/admin/users">
    <input type="hidden" name="csrf_token" value="{{ ctx.csrf_token }}">
    <label>{{ tr('Phone') }}<input name="phone" maxlength="20" required></label>
    <label>{{ tr('Full name') }}<input name="full_name" maxlength="120"></label>
    <label>{{ tr('Email') }}<input name="email" type="email" maxlength="255"></label>
    <label>{{ tr('Role') }}<select name="role">{% for role in user_roles %}<option value="{{ tr(role) }}">{{ tr(role) }}</option>{% endfor %}</select></label>
    <button type="submit">{{ tr('Create user') }}</button>
  </form>
</section>
{% endblock %}
