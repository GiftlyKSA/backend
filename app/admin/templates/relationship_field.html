{% macro relationship_field(table, field, label, required=true, value='', selected_label='', record_id='') %}
<div class="relationship-field" data-url="/admin/relationships/{{ table }}/{{ field }}" data-record-id="{{ record_id }}">
  <label for="{{ field }}-search">Search {{ label|lower }}</label>
  <input id="{{ field }}-search" class="relationship-search" type="search" maxlength="100" autocomplete="off" placeholder="Search records…">
  <label for="{{ field }}">{{ label }}</label>
  <select id="{{ field }}" name="{{ field }}" {% if required %}required{% endif %}>
    <option value="">{% if required %}Choose a record{% else %}None{% endif %}</option>
    {% if value %}<option value="{{ value }}" selected>{{ selected_label or value }}</option>{% endif %}
  </select>
  <button class="secondary relationship-more" type="button" hidden>Load more</button>
  <p class="note relationship-status" role="status" aria-live="polite"></p>
</div>
{% endmacro %}
