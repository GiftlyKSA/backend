{% extends "base.html" %}
{% block content %}
<h1>Redemptions</h1>
<p><a class="btn" href="/v1/admin/admin/tables/promo_redemptions/new">Add redemption</a> <a class="btn secondary" href="/v1/admin/admin/tables/promo_redemptions">View all redemptions</a></p>
<table class="list">
  <thead><tr><th>User</th><th>Invoice</th><th>Amount</th><th>Status</th></tr></thead>
  <tbody>{% for r in redemptions %}
    <tr><td>{{ r.user_id }} · <a href="/v1/admin/admin/tables/promo_redemptions/{{ r.id }}/edit">Edit / delete</a></td><td>{{ r.invoice_id }}</td><td class="num">{{ r.discount_amount }}</td><td>{{ r.status }}</td></tr>
  {% else %}<tr><td colspan="4">None.</td></tr>{% endfor %}</tbody>
</table>
{% endblock %}
