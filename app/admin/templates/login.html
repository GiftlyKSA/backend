{% extends "base.html" %}
{% block content %}
<section class="card narrow">
  <h1>Admin sign in</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/v1/admin/admin/login">
    <label>Username
      <input name="username" type="text" autocomplete="username" value="{{ username or '' }}" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    {% if require_totp %}
    <label>Authenticator code
      <input name="totp_code" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required>
    </label>
    {% endif %}
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
