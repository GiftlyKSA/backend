{% extends "base.html" %}
{% from "relationship_field.html" import relationship_field with context %}
{% block content %}
<h1>{{ tr('Add order') }}</h1>
<p class="note">{{ tr('Orders are created as NEW for an existing active customer.') }}</p>
<section class="card edit-card">
  <form method="post" action="/v1/admin/admin/orders">
    <input type="hidden" name="csrf_token" value="{{ ctx.csrf_token }}">
    {{ relationship_field('orders', 'customer_id', 'Customer') }}
    <label>{{ tr('City') }}<select name="delivery_city" required><option value="">{{ tr('Select a city') }}</option>{% for city in cities %}<option value="{{ city.name }}">{{ city.name }}</option>{% endfor %}</select></label>
    <label>{{ tr('Delivery date') }}<input name="delivery_date" type="date" min="{{ today }}" required></label>
    <label>{{ tr('Description') }}<textarea name="description" maxlength="5000"></textarea></label>
    <label>{{ tr('Address note') }}<textarea name="delivery_address_note" maxlength="255"></textarea></label>
    <button type="submit">{{ tr('Create order') }}</button>
  </form>
</section>
{% endblock %}
