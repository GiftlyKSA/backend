{% extends "base.html" %}
{% from "relationship_field.html" import relationship_field %}
{% block content %}
<h1>Add order</h1>
<p class="note">Orders are created as NEW for an existing active customer. Paste the customer's Google Maps link.</p>
<section class="card edit-card">
  <form method="post" action="/v1/admin/admin/orders">
    <input type="hidden" name="csrf_token" value="{{ ctx.csrf_token }}">
    {{ relationship_field('orders', 'customer_id', 'Customer') }}
    <label>City<select name="delivery_city" required><option value="">Select a city</option>{% for city in cities %}<option value="{{ city.name }}">{{ city.name }}</option>{% endfor %}</select></label>
    <label>Delivery date<input name="delivery_date" type="date" min="{{ today }}" required></label>
    <label>Google Maps link (optional)<input name="delivery_map_url" type="url" maxlength="2048"></label>
    <label>Description<textarea name="description" maxlength="5000"></textarea></label>
    <label>Address note<textarea name="delivery_address_note" maxlength="255"></textarea></label>
    <button type="submit">Create order</button>
  </form>
</section>
{% endblock %}
